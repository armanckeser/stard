name: Deploy Worker

# The Cloudflare Worker behind stard.armanckeser.com/api, /run, /battle and /team.
# It imports server/, so any push to main can change it; deploying unchanged code
# is harmless. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets,
# and skips with a notice until they exist.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the Worker deploy."
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm ci --prefix worker
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: worker
